services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-flarum}
      MARIADB_USER: ${DB_USER:-flarum}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    security_opt:
      - no-new-privileges:true
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    build:
      context: ./mail
    image: flarum-mail:local
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.example.org}
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:?set MAIL_DOMAIN in .env}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.${MAIL_DOMAIN}}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      DKIM_KEY_BITS: ${DKIM_KEY_BITS:-2048}
      MAIL_RELAYHOST: ${MAIL_RELAYHOST:-}
      MAIL_RELAY_USER: ${MAIL_RELAY_USER:-}
      MAIL_RELAY_PASS: ${MAIL_RELAY_PASS:-}
    # No published ports. Reachable only from the forum on the compose
    # network — an MTA on a public port gets found and abused within hours.
    expose:
      - "25"
    security_opt:
      - no-new-privileges:true
    volumes:
      # The DKIM keypair must outlive the container: regenerating it would
      # invalidate the DNS record you published.
      - dkim-keys:/var/lib/opendkim

  flarum:
    build:
      context: .
      args:
        FLARUM_VERSION: ${FLARUM_VERSION:-v1.8.19}
    image: flarum-gamification:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      # Host port is yours to pick; the container side is always 8888, so
      # changing HTTP_PORT needs a restart, not a rebuild.
      - "${HTTP_PORT:-8888}:8888"
    # nginx and php-fpm both run as www-data on an unprivileged port, so the
    # container needs no capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-flarum}
      DB_USER: ${DB_USER:-flarum}
      DB_PASS: ${DB_PASS}
      FORUM_URL: ${FORUM_URL:-http://localhost:8888}
      FORUM_TITLE: ${FORUM_TITLE:-Flarum}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-}
      ADMIN_MAIL: ${ADMIN_MAIL:-admin@example.com}
      FLARUM_DEBUG: ${FLARUM_DEBUG:-false}
      ENABLE_EXTENSIONS: ${ENABLE_EXTENSIONS:-fof-gamification,fof-webhooks,flarum-lang-dutch}
      FORUM_LOCALE: ${FORUM_LOCALE:-nl}
      SEED_TAGS_ALWAYS: ${SEED_TAGS_ALWAYS:-false}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_FROM: ${MAIL_FROM:-noreply@${MAIL_DOMAIN}}
      MAIL_HOST: ${MAIL_HOST:-mail}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      VOTE_FIRST_POST_ONLY: ${VOTE_FIRST_POST_ONLY:-true}
      VOTE_ALLOW_SELF_VOTES: ${VOTE_ALLOW_SELF_VOTES:-false}
      VOTE_UPVOTES_ONLY: ${VOTE_UPVOTES_ONLY:-false}
      VOTE_LIST_LAYOUT: ${VOTE_LIST_LAYOUT:-true}
      VOTE_SHOW_ON_LIST: ${VOTE_SHOW_ON_LIST:-true}
    volumes:
      - flarum-storage:/flarum/app/storage
      - flarum-assets:/flarum/app/public/assets

volumes:
  dkim-keys:
  db-data:
  flarum-storage:
  flarum-assets:
