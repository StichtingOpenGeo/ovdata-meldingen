; php-fpm and nginx both need to run, and neither should be able to take the
; container down quietly: if one dies, supervisor restarts it. Without this,
; a php-fpm crash would leave nginx up and the container "healthy" while
; serving nothing but 502s.
[supervisord]
nodaemon = true
user = www-data
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autorestart = true
startretries = 3
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autorestart = true
startretries = 3
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Flarum's application log is a file on a volume; without this it never reaches
; "docker compose logs" and mail failures are invisible.
[program:flarum-log]
command = /usr/local/bin/tail-flarum-log
autorestart = true
priority = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
