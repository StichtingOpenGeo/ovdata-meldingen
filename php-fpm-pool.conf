; Replaces the base image's www.conf entirely. There is no user/group here:
; the pool inherits www-data from the container, and setting them would make
; php-fpm warn that it cannot switch user while not running as root.
[www]
listen = /var/run/flarum/php-fpm.sock
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Send worker output to the container log instead of swallowing it, so a PHP
; fatal error is visible in "docker compose logs".
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

clear_env = no
