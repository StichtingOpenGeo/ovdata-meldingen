# Runs as www-data, so every path nginx writes to must be one it owns:
# the pid file, the temp directories, and the logs (which go to the container's
# stdout/stderr rather than files). There is no "user" directive on purpose —
# setting one requires root, and this master process is not root.

worker_processes  auto;
pid               /var/run/flarum/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Matches upload_max_filesize / post_max_size in the PHP config; nginx
    # rejects oversized bodies before PHP ever sees them.
    client_max_body_size  16M;

    client_body_temp_path  /var/lib/nginx/body;
    fastcgi_temp_path      /var/lib/nginx/fastcgi;

    server {
        listen       __HTTP_PORT__;
        server_name  _;

        root   /flarum/app/public;
        index  index.php;

        charset utf-8;

        # Apache got these from Flarum's .htaccess, which nginx ignores.
        add_header X-Content-Type-Options  "nosniff"    always;
        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header Referrer-Policy         "same-origin" always;

        # Flarum's own recommended rules, shipped in the skeleton: the front
        # controller, cache expiry per file type, and gzip. Using the file the
        # project maintains means these stay correct across upgrades.
        include /flarum/app/.nginx.conf;

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   unix:/var/run/flarum/php-fpm.sock;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120s;
        }

        # Defence in depth. None of these live under the document root, so they
        # are already unreachable; this makes a future misconfiguration fail
        # closed rather than serve source code and credentials.
        location ~* ^/(\.git|composer\.(json|lock)|auth\.json|config\.php|flarum|storage|vendor) {
            deny all;
            return 404;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
