# Dutch translations for fof/gamification, which flarum-lang/dutch does not
# cover. Registered from the site's extend.php, so it also overrides any
# upstream strings should the pack add them later.
core:
  forum:
    index_sort:
      hot_button: Populair
      votes_button: Stemmen

fof-gamification:
  forum:
    votes: Stemmen
    vote_title: Bekijk wie er gestemd heeft
    nav:
      name: Ranglijst
    ranking:
      rank: Plaats
      name: Gebruiker
      amount: Punten
    notification:
      upvote: "{username} stemde je bericht omhoog"
      downvote: "{username} stemde je bericht omlaag"
      prefrences:
        vote: Wanneer er op een van mijn berichten wordt gestemd
    user:
      card:
        points: "{count, plural, one { {count} punt} other {{count} punten}}"
      rank: "{rank}"
      votes_link: Stemmen
    modal:
      title: Stemmers
      upvotes_label: 'Omhoog gestemd door:'
      downvotes_label: 'Omlaag gestemd door:'
    mod_item: Bekijk stemmers
    voters:
      none: Nog niemand heeft gestemd
      label: Stemmers
      label_none: Geen stemmen
    post:
      upvote_button: Stem omhoog
      downvote_button: Stem omlaag

# fof/webhooks ships English strings but flarum-lang/dutch has no
# fof-webhooks.yml, and the fallback to English does not reach the queued job
# that renders these — so every Slack, Discord or Teams message arrived reading
# "fof-webhooks.actions.discussion.started". Only the action strings are
# translated here: those are the ones that leave the forum.
fof-webhooks:
  actions:
    discussion:
      started: "Nieuwe discussie `{1}`"
      renamed:
        title: "Discussie hernoemd `{1}`"
        description: "Nieuwe titel: {1}"
      hidden: "Discussie verborgen `{1}`"
      restored: "Discussie hersteld `{1}`"
      deleted: "Discussie verwijderd `{1}`"

    group:
      created: "Groep `{1}` aangemaakt"
      renamed: "Groep hernoemd naar `{1}`"
      deleted: "Groep `{1}` verwijderd"

    post:
      posted: "Nieuwe reactie in `{1}`"
      revised: "Reactie bewerkt in `{1}`"
      hidden: "Reactie verborgen in `{1}`"
      restored: "Reactie hersteld in `{1}`"
      deleted: "Reactie verwijderd in `{1}`"
      approved: "Reactie goedgekeurd in `{1}`"

    user:
      registered: Nieuwe gebruiker geregistreerd
      renamed:
        title: "Gebruikersnaam gewijzigd van `{1}`"
        description: "Nieuwe gebruikersnaam: {1}"
      deleted: "Gebruiker `{1}` verwijderd"
