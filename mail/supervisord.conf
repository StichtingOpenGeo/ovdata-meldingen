[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

; rsyslog first: the milters log through it, and a milter that fails to start
; is otherwise silent.
[program:rsyslog]
command = rsyslogd -n -f /etc/rsyslog.conf
autorestart = true
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:opendkim]
command = opendkim -f -x /etc/opendkim.conf
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:opendmarc]
command = opendmarc -f -c /etc/opendmarc.conf
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; postfix last, so the milters are listening before it accepts anything.
[program:postfix]
command = /usr/sbin/postfix start-fg
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
