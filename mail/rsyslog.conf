# opendkim and opendmarc only speak syslog, so without this their diagnostics
# vanish — which is exactly what you need when a signature is not being added.
# Everything is funnelled to the container's stdout.
module(load="imuxsock")
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
template(name="plain" type="string" string="%syslogtag%%msg%\n")
*.* /dev/stdout;plain
