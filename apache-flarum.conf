<VirtualHost *:80>
    DocumentRoot /flarum/app/public

    <Directory /flarum/app/public>
        # Flarum ships its own .htaccess (front controller rewrites,
        # security headers, compression) — it must be honoured.
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>

    # Never serve the application internals, even if something ends up
    # symlinked into the docroot.
    <DirectoryMatch "^/flarum/app/(vendor|storage|extensions)">
        Require all denied
    </DirectoryMatch>

    # Behind a reverse proxy? Uncomment BOTH lines and set the proxy's
    # address. Enabling RemoteIPHeader without a trusted-proxy list lets any
    # client spoof its own IP, so the two belong together.
    # RemoteIPHeader X-Forwarded-For
    # RemoteIPTrustedProxy 172.16.0.0/12

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
